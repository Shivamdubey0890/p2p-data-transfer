# Render Blueprint — deploys the M1 signaling server (free tier).
# Render terminates HTTPS for you; the app runs plain HTTP internally.
services:
  - type: web
    name: p2p-transfer-server
    runtime: node
    plan: free
    # Single service: builds BOTH the server and the client; the server then
    # serves the client from the same origin (no CORS, one URL).
    # --include=dev: NODE_ENV=production would otherwise skip devDependencies,
    # and the TypeScript/Vite compilers are devDependencies.
    buildCommand: npm --prefix server ci --include=dev && npm --prefix server run build && npm --prefix client ci --include=dev && npm --prefix client run build
    startCommand: node server/dist/server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: CORS_ORIGIN
        value: http://localhost:5173 # own URL is allowed automatically via RENDER_EXTERNAL_URL
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      # Free TURN relay (Open Relay Project) — needed when both peers are
      # behind strict NATs (e.g. mobile CGNAT). Multiple transports: UDP, TCP
      # and TLS:443 so at least one gets through restrictive networks.
      # Traffic stays DTLS-encrypted end to end; TURN can't read it.
      - key: TURN_URL
        value: turn:openrelay.metered.ca:80,turn:openrelay.metered.ca:443,turn:openrelay.metered.ca:443?transport=tcp,turns:openrelay.metered.ca:443?transport=tcp
      - key: TURN_USERNAME
        value: openrelayproject
      - key: TURN_PASSWORD
        value: openrelayproject
